services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: orders
      POSTGRES_PASSWORD: orders
      POSTGRES_DB: orders
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orders -d orders"]
      interval: 5s
      timeout: 5s
      retries: 20

  migrate:
    build:
      context: .
      dockerfile: deploy/Dockerfile
      args:
        BUILD_TAGS: postgres
    command: ["/app/migrate", "-dir", "/app/migrations"]
    environment:
      DATABASE_URL: "postgres://orders:orders@db:5432/orders?sslmode=disable"
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  # NOTE: the api service runs the in-memory store by default (see
  # cmd/api/main.go and docs/architecture.md, "Storage backends"). The
  # db/migrate services deploy and verify the PostgreSQL schema this
  # scenario is built around; wiring api's read/write path onto that
  # schema (storage.PostgresStore under `-tags postgres`) is a
  # documented follow-up, not silently claimed here.
  api:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    command: ["/app/api"]
    environment:
      APP_ADDR: ":8081"
      APP_SANDBOX_MODE: "true"
      BUILD_COMMIT: dev
      BUILD_BUILT_AT: "2026-08-10T00:00:00Z"
    ports:
      - "8081:8081"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8081/healthz"]
      interval: 10s
      timeout: 5s
      retries: 10

  worker:
    build:
      context: .
      dockerfile: deploy/Dockerfile
      args:
        BUILD_TAGS: postgres
    command: ["/app/worker"]
    environment:
      DATABASE_URL: "postgres://orders:orders@db:5432/orders?sslmode=disable"
    depends_on:
      api:
        condition: service_healthy

  frontend:
    image: node:20-alpine
    working_dir: /app
    command: ["sh", "-c", "npm install --no-audit --no-fund && npm run build && npx vite preview --host 0.0.0.0 --port 5174"]
    environment:
      VITE_API_BASE: /api/v1
    volumes:
      - ./frontend:/app
    ports:
      - "5174:5174"
    depends_on:
      - api

  seed:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    command: ["/app/seed", "-out", "/data/fixtures", "-profile", "medium"]
    volumes:
      - ./testdata/fixtures:/data/fixtures
    depends_on:
      - db

volumes:
  pgdata:
